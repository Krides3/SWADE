<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LUXOR — Tactical Cheat Sheet</title>
    <link rel="stylesheet" href="./style.css">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        :root {
            --bg-cs: #0a0c12;
            --panel-cs: rgba(20, 24, 36, 0.98);
            --gold: #b8a800;
            --gold-dim: #c7bd31;
            --cyan: #00e5c8;
            --border: #2a2f45;
            --text: #d4d0b0;
            --text-dim: #6b6860;
            --danger: #c0392b;
        }

        body, html {
            margin: 0;
            padding: 0;
            height: 100dvh;
            background: var(--bg-cs);
            color: var(--text);
            font-family: 'Share Tech Mono', monospace;
            overflow: hidden;
            position: relative;
        }

        /* Subtle Scanline Effect */
        body::before {
            content: " ";
            display: block;
            position: absolute;
            top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
            z-index: 1000;
            background-size: 100% 4px, 3px 100%;
            pointer-events: none;
            opacity: 0.1;
        }

        .cs-layout {
            display: grid;
            grid-template-columns: 1fr 1fr;
            grid-template-rows: auto 1fr;
            height: 100%;
            gap: 1px;
            background: var(--border);
            position: relative;
            z-index: 1;
        }

        .cs-header {
            grid-column: 1 / -1;
            background: #000;
            padding: 10px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-family: 'Orbitron', sans-serif;
            font-weight: 900;
            font-size: 1.8rem;
            color: var(--gold);
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .cs-mission-display {
            display: flex;
            gap: 15px;
        }

        .cs-status-display {
            color: var(--cyan);
        }

        .cs-sidebar {
            grid-row: 2;
            background: var(--bg-cs);
            display: flex;
            flex-direction: column;
            overflow: hidden; /* Prevent scrolling */
            border-right: 1px solid var(--border);
        }

        .cs-main {
            grid-row: 2;
            background: #0d0f18;
            overflow-y: auto;
            padding: 30px;
            display: flex;
            flex-direction: column;
            border-left: 1px solid var(--border);
        }

        .cs-section {
            padding: 2.2vh 2.5vw;
            border-bottom: 1px solid rgba(255,255,255,0.05);
            flex-shrink: 1;
        }

        .squad-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 1.5vh 1vw;
        }

        .operator-item {
            display: flex;
            flex-direction: column;
        }

        .operator-item.tl {
            border-left: 3px solid var(--gold);
            padding-left: 10px;
        }

        .op-name {
            font-size: clamp(1.1rem, 2.4vh, 1.6rem);
            color: var(--text);
            font-weight: bold;
            text-transform: uppercase;
            line-height: 1.1;
        }

        .op-role {
            font-size: clamp(0.7rem, 1.5vh, 1rem);
            color: var(--gold-dim);
            text-transform: uppercase;
            margin-top: 1px;
            opacity: 0.8;
        }

        .radio-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1.5vh 2.5vw;
        }

        .radio-item {
            display: flex;
            flex-direction: column;
        }

        .r-call { 
            color: var(--text); 
            font-weight: bold; 
            font-size: clamp(1rem, 2.2vh, 1.5rem); 
            display: block;
            line-height: 1.1;
            margin-bottom: 3px;
        }
        
        .r-def { 
            color: var(--text-dim); 
            font-size: clamp(0.8rem, 1.8vh, 1.1rem); 
            line-height: 1.3;
        }

        .briefing-content {
            font-size: 1.35rem;
            line-height: 1.7;
            color: var(--text);
        }

        .briefing-content h1, .briefing-content h2, .briefing-content h3 { 
            color: var(--gold); 
            margin-top: 30px; 
            margin-bottom: 20px;
            font-family: 'Orbitron', sans-serif;
            text-transform: uppercase;
            border-bottom: 1px solid rgba(184, 168, 0, 0.2);
            padding-bottom: 8px;
            font-size: 1.4rem;
        }
        
        .briefing-content p { margin-bottom: 15px; }

        .tactical-gallery {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 20px;
            margin-top: 35px;
        }

        .tactical-img-container {
            border: 1px solid var(--border);
            background: #000;
            padding: 3px;
        }

        .tactical-img-container img {
            width: 100%;
            display: block;
        }

        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #05060a; }
        ::-webkit-scrollbar-thumb { background: #1a1e2b; }
        ::-webkit-scrollbar-thumb:hover { background: var(--gold-dim); }

        @media (max-width: 1100px) {
            .cs-layout { grid-template-columns: 1fr; overflow-y: auto; height: auto; }
            .cs-sidebar, .cs-main { overflow-y: visible; height: auto; }
            body, html { overflow-y: auto; height: auto; }
        }
    </style>
</head>
<body>

<div class="cs-layout">
    <header class="cs-header">
        <div class="cs-mission-display">
            LUXOR: <span id="mission-name">ENCRYPTED</span>
        </div>
        <div class="cs-status-display">
            STATUS: <span id="mission-status">UNKNOWN</span>
        </div>
    </header>

    <aside class="cs-sidebar">
        <section class="cs-section">
            <div class="squad-grid" id="squad-grid">
                <!-- Populated by JS -->
            </div>
        </section>

        <section class="cs-section">
            <div id="phonetic-grid">
                <!-- Populated by JS -->
            </div>
        </section>

        <section class="cs-section" style="border-bottom: none;">
            <div class="radio-grid" id="radio-list">
                <!-- Populated by JS -->
            </div>
        </section>
    </aside>

    <main class="cs-main">
        <div id="mission-plan" class="briefing-content">
            <!-- Populated by JS -->
        </div>
        <div id="plan-gallery" class="tactical-gallery"></div>
    </main>
</div>

<script src="./auth.js"></script>
<script src="https://cdn.jsdelivr.net/npm/convex@1.12.0/dist/browser.bundle.js"></script>
<script src="./cheatsheet.js"></script>
</body>
</html>
