<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LUXOR — Tactical Cheat Sheet</title>
    <link rel="stylesheet" href="./style.css">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        :root {
            --bg-cs: #0a0c12;
            --panel-cs: rgba(20, 24, 36, 0.95);
        }

        body, html {
            margin: 0;
            padding: 0;
            height: 100dvh;
            background: var(--bg-cs);
            color: var(--text);
            font-family: 'Share Tech Mono', monospace;
            overflow: hidden;
        }

        .cs-layout {
            display: grid;
            grid-template-columns: 1fr 1fr;
            grid-template-rows: auto 1fr;
            height: 100%;
            gap: 1px;
            background: var(--border);
        }

        .cs-header {
            grid-column: 1 / -1;
            background: var(--bg-cs);
            padding: 15px 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 3px solid var(--gold);
        }

        .cs-mission-name {
            font-family: 'Orbitron', sans-serif;
            font-size: 2rem;
            color: var(--gold);
            text-transform: uppercase;
            text-shadow: 0 0 10px rgba(184, 168, 0, 0.3);
        }

        .cs-sidebar {
            grid-row: 2;
            background: var(--bg-cs);
            display: flex;
            flex-direction: column;
            gap: 1px;
            overflow-y: auto;
            border-right: 1px solid var(--border);
        }

        .cs-main {
            grid-row: 2;
            background: var(--bg-cs);
            overflow-y: auto;
            padding: 25px;
            display: flex;
            flex-direction: column;
        }

        .cs-section {
            background: var(--panel-cs);
            padding: 20px;
            border-bottom: 1px solid var(--border);
        }

        .cs-section-title {
            color: var(--gold-dim);
            font-size: 0.85rem;
            letter-spacing: 3px;
            margin-bottom: 15px;
            text-transform: uppercase;
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: bold;
        }

        .cs-section-title::after {
            content: "";
            flex: 1;
            height: 1px;
            background: rgba(255,255,255,0.1);
        }

        .squad-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
        }

        .operator-card {
            border: 1px solid rgba(255,255,255,0.08);
            padding: 10px 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(255,255,255,0.03);
        }

        .operator-card.tl {
            border-left: 4px solid var(--gold);
            background: rgba(184, 168, 0, 0.08);
        }

        .op-info {
            display: flex;
            flex-direction: column;
        }

        .op-name {
            font-size: 1rem;
            color: var(--text);
            font-weight: bold;
        }

        .op-role {
            font-size: 0.65rem;
            color: var(--gold-dim);
            text-transform: uppercase;
        }

        .radio-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .radio-item {
            display: flex;
            flex-direction: column;
        }

        .r-call { color: var(--cyan); font-weight: bold; font-size: 0.9rem; }
        .r-def { color: var(--text-dim); font-size: 0.8rem; line-height: 1.3; }

        .briefing-content {
            font-size: 1.15rem;
            line-height: 1.6;
            color: var(--text);
        }
        .briefing-content h1, .briefing-content h2, .briefing-content h3 { color: var(--gold); margin-top: 25px; margin-bottom: 15px;}
        .briefing-content p { margin-bottom: 15px; }

        .tactical-gallery {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(400px, 1fr));
            gap: 20px;
            margin-top: 40px;
        }

        .tactical-img-container {
            border: 1px solid var(--border);
            background: #000;
            box-shadow: 0 5px 15px rgba(0,0,0,0.5);
        }

        .tactical-img-container img {
            width: 100%;
            display: block;
        }

        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: var(--bg-cs); }
        ::-webkit-scrollbar-thumb { background: var(--border); }
        ::-webkit-scrollbar-thumb:hover { background: var(--gold-dim); }

        @media (max-width: 1000px) {
            .cs-layout { grid-template-columns: 1fr; overflow-y: auto; height: auto; }
            .cs-sidebar, .cs-main { overflow-y: visible; height: auto; }
            body, html { overflow-y: auto; height: auto; }
        }
    </style>
</head>
<body>

<div class="cs-layout">
    <header class="cs-header">
        <div>
            <div style="font-size: 0.7rem; color: var(--text-dim); letter-spacing: 3px; font-weight: bold;">LUXOR // TACTICAL REFERENCE HUB</div>
            <div class="cs-mission-name" id="mission-name">INITIALIZING...</div>
        </div>
        <div id="mission-date" style="color: var(--gold-dim); font-size: 1rem; font-weight: bold; font-family: 'Orbitron', sans-serif;"></div>
    </header>

    <aside class="cs-sidebar">
        <section class="cs-section">
            <div class="cs-section-title">OPERATIONAL SQUAD</div>
            <div class="squad-grid" id="squad-grid">
                <!-- Populated by JS -->
            </div>
        </section>

        <section class="cs-section">
            <div class="cs-section-title">NATO PHONETIC</div>
            <div id="phonetic-grid">
                <!-- Populated by JS -->
            </div>
        </section>

        <section class="cs-section">
            <div class="cs-section-title">RADIO GLOSSARY</div>
            <div class="radio-list" id="radio-list">
                <!-- Populated by JS -->
            </div>
        </section>
    </aside>

    <main class="cs-main">
        <div class="cs-section-title">MISSION TACTICAL PLAN</div>
        <div id="mission-plan" class="briefing-content">
            <!-- Populated by JS -->
        </div>
        <div id="plan-gallery" class="tactical-gallery"></div>
    </main>
</div>

<script src="./auth.js"></script>
<script src="https://cdn.jsdelivr.net/npm/convex@1.12.0/dist/browser.bundle.js"></script>
<script src="./cheatsheet.js"></script>
</body>
</html>
