  <div style="margin-left: 240px; padding: 2em;">
    <h1>PDF Viewer</h1>
    <label for="pdf-select">Choose a PDF:</label>
    <select id="pdf-select">
      <option value="./assets/PDF/core_rules.pdf">Core Rules</option>
    </select>
    <div class="pdf-viewer" style="margin-top: 2em;">
      <iframe id="pdf-frame" src="./assets/PDF/core_rules.pdf" style="border: none;"></iframe>
    </div>
  </div>

  <script>
    document.getElementById('pdf-select').addEventListener('change', function () {
      document.getElementById('pdf-frame').src = this.value;
    });
  </script>
