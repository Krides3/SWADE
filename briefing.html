<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LUXOR — Briefing Tool</title>
    <link rel="stylesheet" href="./style.css">
    <style>
        .briefing-grid {
            display: grid;
            grid-template-columns: 300px 1fr;
            gap: 20px;
            height: calc(100vh - 120px);
        }
        .mission-list {
            background: var(--bg-panel);
            border: 1px solid var(--border);
            padding: 15px;
            overflow-y: auto;
        }
        .mission-detail {
            background: var(--bg-panel);
            border: 1px solid var(--border);
            padding: 25px;
            overflow-y: auto;
            position: relative;
        }
        .mission-item {
            padding: 12px;
            border: 1px solid var(--border);
            margin-bottom: 10px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .mission-item:hover {
            border-color: var(--gold-dim);
            background: rgba(184,168,0,0.05);
        }
        .mission-item.active {
            border-color: var(--gold);
            background: rgba(184,168,0,0.1);
        }
        .mission-title {
            color: var(--gold);
            font-family: 'Orbitron', sans-serif;
            font-size: 0.8rem;
            margin-bottom: 5px;
        }
        .mission-meta {
            font-size: 0.65rem;
            color: var(--text-dim);
        }
        .briefing-header {
            border-bottom: 1px solid var(--gold-dim);
            padding-bottom: 15px;
            margin-bottom: 20px;
        }
        .briefing-name {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.5rem;
            color: var(--gold);
            letter-spacing: 0.1em;
        }
        .briefing-info-row {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 20px;
            margin-top: 15px;
            font-size: 0.75rem;
        }
        .info-label { color: var(--gold-dim); letter-spacing: 0.1em; margin-bottom: 3px; }
        .info-value { color: var(--cyan); }
        
        .briefing-text {
            font-family: 'Share Tech Mono', monospace;
            line-height: 1.6;
            white-space: pre-wrap;
            margin-top: 30px;
            color: var(--text);
        }

        /* Editor Styles */
        .editor-form {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .editor-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }
        .form-group { display: flex; flex-direction: column; gap: 5px; }
        .form-input {
            background: #0d1018;
            border: 1px solid var(--border);
            color: var(--text);
            padding: 10px;
            font-family: inherit;
        }
        .form-textarea {
            background: #0d1018;
            border: 1px solid var(--border);
            color: var(--text);
            padding: 10px;
            font-family: inherit;
            min-height: 200px;
            resize: vertical;
        }
        .operator-selector {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
            gap: 10px;
            border: 1px solid var(--border);
            padding: 10px;
            max-height: 150px;
            overflow-y: auto;
        }
        .op-checkbox {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.7rem;
            cursor: pointer;
        }
        
        .btn-action {
            padding: 12px;
            background: transparent;
            border: 1px solid var(--gold-dim);
            color: var(--gold);
            cursor: pointer;
            font-family: 'Orbitron', sans-serif;
            font-size: 0.7rem;
            letter-spacing: 0.1em;
        }
        .btn-action:hover {
            background: rgba(184,168,0,0.1);
        }

        .handler-controls {
            position: absolute;
            top: 25px;
            right: 25px;
            display: flex;
            gap: 10px;
        }
    </style>
</head>
<body>

<div class="app">
    <nav class="navbar" id="navbar">
        <div class="nav-brand">
            <div class="nav-brand-title">LUXOR</div>
            <div class="nav-brand-sub">// TACTICAL OPS //</div>
        </div>
        <ul class="nav-links">
            <!-- Dynamic Injection -->
        </ul>
        <div class="nav-footer">
            <span class="status-dot"></span>
            <span id="nav-username">——————</span>
            <button id="nav-logout" class="nav-logout-btn">LOGOUT</button>
        </div>
    </nav>

    <button class="hamburger" id="hamburger" aria-label="Menu">
        <span></span><span></span><span></span>
    </button>

    <main class="main">
        <div class="page-header">
            <div style="display:flex; justify-content:space-between; align-items:flex-start;">
                <div>
                    <h1>Mission Briefing</h1>
                    <div class="tagline">// DAGGER SQUAD OPERATIONAL DATA //</div>
                </div>
                <button class="btn-action" onclick="window.location.href='index.html'">RETURN TO DASHBOARD</button>
            </div>
            <div class="header-divider"></div>
        </div>

        <div class="briefing-grid">
            <div class="mission-list" id="mission-list">
                <!-- Missions will appear here -->
                <div class="mission-meta" style="text-align:center; padding:20px;">FETCHING INTEL...</div>
            </div>

            <div class="mission-detail" id="mission-detail">
                <div class="mission-meta" style="text-align:center; padding:100px;">SELECT A MISSION RECORD</div>
            </div>
        </div>
    </main>
</div>

<!-- Modal for Creating/Editing Missions -->
<div id="mission-modal" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,0.85); z-index:1000; align-items:center; justify-content:center; padding:20px;">
    <div style="background:var(--bg-panel); border:1px solid var(--gold); width:100%; max-width:800px; padding:30px; position:relative;">
        <button onclick="document.getElementById('mission-modal').style.display='none'" style="position:absolute; top:15px; right:15px; background:none; border:none; color:var(--text-dim); cursor:pointer;">[ CLOSE ]</button>
        <h2 id="modal-title" style="font-family:'Orbitron',sans-serif; color:var(--gold); margin-bottom:20px;">NEW BRIEFING</h2>
        
        <form id="mission-form" class="editor-form">
            <input type="hidden" id="edit-id">
            <div class="editor-row">
                <div class="form-group">
                    <label class="info-label">MISSION NAME</label>
                    <input type="text" id="mission-name" class="form-input" required>
                </div>
                <div class="form-group">
                    <label class="info-label">LOCATION</label>
                    <input type="text" id="mission-location" class="form-input">
                </div>
            </div>
            <div class="form-group">
                <label class="info-label">TACTICAL MAP URL (IMG)</label>
                <input type="text" id="mission-map" class="form-input" placeholder="https://...">
            </div>
            <div class="editor-row">
                <div class="form-group">
                    <label class="info-label">OPERATIONAL DATE</label>
                    <input type="text" id="mission-date" class="form-input" placeholder="e.g. 2026-05-25">
                </div>
                <div class="form-group">
                    <label class="info-label">MISSION LEADER</label>
                    <select id="mission-leader" class="form-input">
                        <option value="">-- UNASSIGNED --</option>
                        <!-- DAGGER operators -->
                    </select>
                </div>
            </div>
            
            <div class="form-group">
                <label class="info-label">ASSIGN SQUAD (DAGGER)</label>
                <div class="operator-selector" id="op-list">
                    <!-- Operators checkboxes -->
                </div>
            </div>

            <div class="form-group">
                <label class="info-label">BRIEFING DATA</label>
                <textarea id="mission-briefing" class="form-textarea" required></textarea>
            </div>

            <button type="submit" class="btn-action" style="margin-top:10px;">UPLOAD TO TERMINAL</button>
        </form>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/convex@1.12.0/dist/browser.bundle.js"></script>
<script src="./auth.js"></script>
<script src="./nav.js"></script>
<script src="./briefing.js"></script>
</body>
</html>
