<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
    <title>LUXOR — Mission View</title>
    <link rel="stylesheet" href="./style.css">
    <style>
        /* ── Mission View overrides ──────────────────────────────── */
        .app { height: 100vh; overflow: hidden; }

        .mv-main {
            margin-left: var(--navbar-w);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            padding: 0;
        }

        /* ── Toolbar ─────────────────────────────────────────────── */
        .mv-toolbar {
            background: var(--bg-panel);
            border-bottom: 1px solid var(--border);
            padding: 0 0.85rem;
            height: 40px;
            display: flex;
            align-items: center;
            gap: 0.55rem;
            flex-shrink: 0;
            z-index: 10;
        }
        .mv-toolbar-label {
            font-family: 'Share Tech Mono', monospace;
            font-size: 0.56rem;
            color: var(--text-dim);
            letter-spacing: 0.16em;
            flex-shrink: 0;
        }
        .mv-layout-btn {
            font-family: 'Share Tech Mono', monospace;
            font-size: 0.56rem;
            letter-spacing: 0.1em;
            padding: 0.22rem 0.6rem;
            border: 1px solid var(--border);
            background: transparent;
            color: var(--text-dim);
            cursor: pointer;
            transition: border-color 0.15s, color 0.15s, background 0.15s;
            white-space: nowrap;
        }
        .mv-layout-btn:hover  { border-color: var(--gold-dim); color: var(--gold); }
        .mv-layout-btn.active { border-color: var(--gold); color: var(--gold); background: rgba(184,168,0,0.05); }

        .mv-sep { width: 1px; height: 18px; background: var(--border); flex-shrink: 0; }

        .mv-save-info {
            margin-left: auto;
            font-family: 'Share Tech Mono', monospace;
            font-size: 0.52rem;
            color: var(--text-dim);
            letter-spacing: 0.12em;
            flex-shrink: 0;
            transition: color 0.2s;
        }
        .mv-save-info.saved { color: var(--cyan); }

        /* ── Pane grid ───────────────────────────────────────────── */
        .mv-grid {
            flex: 1;
            display: grid;
            gap: 3px;
            background: #0d0f18;
            overflow: hidden;
            min-height: 0;
        }
        .mv-grid.l-1  { grid-template-columns: 1fr;       grid-template-rows: 1fr; }
        .mv-grid.l-2h { grid-template-columns: 1fr 1fr;   grid-template-rows: 1fr; }
        .mv-grid.l-2v { grid-template-columns: 1fr;       grid-template-rows: 1fr 1fr; }
        .mv-grid.l-4  { grid-template-columns: 1fr 1fr;   grid-template-rows: 1fr 1fr; }

        /* ── Individual pane ─────────────────────────────────────── */
        .mv-pane {
            display: flex;
            flex-direction: column;
            background: var(--bg-deep);
            overflow: hidden;
            min-height: 0;
        }
        .mv-pane-bar {
            height: 28px;
            background: var(--bg-panel);
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            padding: 0 0.5rem;
            gap: 0.4rem;
            flex-shrink: 0;
        }
        .mv-pane-dot {
            width: 5px; height: 5px;
            border-radius: 50%;
            background: var(--gold-dim);
            flex-shrink: 0;
        }
        .mv-pane-sel {
            flex: 1;
            background: transparent;
            border: none;
            color: var(--gold);
            font-family: 'Share Tech Mono', monospace;
            font-size: 0.56rem;
            letter-spacing: 0.1em;
            cursor: pointer;
            outline: none;
            -webkit-appearance: none;
            appearance: none;
            min-width: 0;
        }
        .mv-pane-sel option {
            background: var(--bg-card);
            color: var(--text);
            font-size: 0.8rem;
        }
        .mv-pane-reload {
            background: transparent;
            border: 1px solid var(--border);
            color: var(--text-dim);
            font-family: 'Share Tech Mono', monospace;
            font-size: 0.5rem;
            padding: 1px 5px;
            cursor: pointer;
            flex-shrink: 0;
            transition: color 0.15s, border-color 0.15s;
            letter-spacing: 0.08em;
        }
        .mv-pane-reload:hover { color: var(--cyan); border-color: var(--cyan); }

        .mv-pane-frame {
            flex: 1;
            width: 100%;
            border: none;
            display: block;
            min-height: 0;
        }
        .mv-pane-empty {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 0.6rem;
            color: var(--text-dim);
            font-family: 'Share Tech Mono', monospace;
            font-size: 0.58rem;
            letter-spacing: 0.2em;
        }
        .mv-pane-empty-icon {
            font-size: 2rem;
            opacity: 0.15;
        }

        /* ── Mobile: collapse to vertical stacks ─────────────────── */
        @media (max-width: 768px) {
            .mv-main { margin-left: 0; }
            .mv-toolbar {
                padding: 0 0.5rem;
                gap: 0.3rem;
                overflow-x: auto;
                flex-wrap: nowrap;
                -webkit-overflow-scrolling: touch;
            }
            .mv-layout-btn {
                padding: 0.35rem 0.6rem;
                min-height: 40px;
                flex-shrink: 0;
            }
            .mv-pane-bar { height: 36px; }
            .mv-pane-reload { padding: 3px 8px; min-height: 32px; }
            .mv-grid.l-2h,
            .mv-grid.l-4  { grid-template-columns: 1fr; grid-template-rows: repeat(auto-fill, minmax(240px, 1fr)); }
        }
    </style>
</head>
<body>
